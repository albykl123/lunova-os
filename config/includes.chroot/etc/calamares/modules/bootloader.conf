# ==============================================================================
# Lunova OS 1.0 Aurora - Calamares Bootloader Module
# ==============================================================================
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/vmlinuz"
fallbackImg: "/initrd.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEpoxyEnabled: true
