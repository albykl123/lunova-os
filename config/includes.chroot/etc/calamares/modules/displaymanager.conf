# ==============================================================================
# Lunova OS 1.0.2 Aurora - Calamares Display Manager Module
# Automatically configures SDDM and sets KDE Plasma as the default session.
# ==============================================================================
---
displaymanagers:
  - sddm

basicSetup: false

defaultDesktopEnvironment:
  executable: "startplasma-wayland"
  desktopFile: "plasmawayland"
