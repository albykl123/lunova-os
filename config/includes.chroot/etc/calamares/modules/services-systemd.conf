# ==============================================================================
# Lunova OS 1.0.2 Aurora - Calamares Systemd Services Module
# Ensures essential networking, display, and audio services are enabled
# on the installed system.
# ==============================================================================
---
services:
  - name: "NetworkManager"
    mandatory: true
  - name: "sddm"
    mandatory: true
  - name: "systemd-timesyncd"
    mandatory: false
  - name: "udisks2"
    mandatory: false
  - name: "bluetooth"
    mandatory: false
  - name: "acpid"
    mandatory: false
