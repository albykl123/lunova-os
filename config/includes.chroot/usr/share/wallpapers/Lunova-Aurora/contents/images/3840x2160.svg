<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Deep Space Canvas -->
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141E38"/>
      <stop offset="50%" stop-color="#0E1528"/>
      <stop offset="100%" stop-color="#080D1C"/>
    </radialGradient>

    <!-- Aurora Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59D9F8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5478FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9270FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9270FF" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#5478FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#59D9F8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#59D9F8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#A7B2C9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5478FF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Blur Filters for Aurora Glass effect -->
    <filter id="auroraBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="3840" height="2160" fill="url(#skyGrad)"/>

  <!-- Aurora Ribbon 1 (Deep Blue & Violet) -->
  <path d="M -200 1200
           C 600 600, 1400 1600, 2200 900
           C 2800 400, 3400 1100, 4100 800
           L 4100 2300 L -200 2300 Z"
        fill="url(#wave2)" filter="url(#auroraBlur)"/>

  <!-- Aurora Ribbon 2 (Cyan & Electric Blue Crest) -->
  <path d="M -100 800
           C 800 1400, 1600 500, 2500 1100
           C 3100 1500, 3600 800, 4000 1200
           L 4000 2300 L -100 2300 Z"
        fill="url(#wave1)" filter="url(#auroraBlur)"/>

  <!-- Dynamic Glass Fold Ribbons -->
  <path d="M 400 1800
           C 1200 1000, 2000 1600, 2800 1100
           C 3400 700, 3700 900, 4000 800
           L 4000 2160 L 400 2160 Z"
        fill="url(#glassWave)"/>

  <!-- Geometric Lunar Sphere & Orbital Halo (Signature Aurora Glass Motif) -->
  <g transform="translate(1920, 1080) scale(1.6)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#59D9F8" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="800 200" transform="rotate(-40)"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#5478FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="1000 400" transform="rotate(25)"/>
  </g>
</svg>
