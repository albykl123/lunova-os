<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#59D9F8"/>
      <stop offset="50%" stop-color="#5478FF"/>
      <stop offset="100%" stop-color="#9270FF"/>
    </linearGradient>
    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Emblem -->
  <g transform="translate(140, 10) scale(0.6)" filter="url(#splashGlow)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#auroraSplash)" stroke-width="8" stroke-dasharray="360 90"/>
    <path d="M 90 35 C 130 35 160 65 160 105 C 160 135 140 160 115 170 C 140 155 148 125 135 100 C 124 80 100 70 80 75 C 84 55 86 35 90 35 Z" fill="url(#auroraSplash)"/>
    <path d="M 65 45 L 65 125 C 65 140 75 150 90 150 L 140 150 C 145 150 148 155 145 160 C 140 165 135 165 130 165 L 85 165 C 60 165 50 150 50 125 L 50 50 C 50 44 60 40 65 45 Z" fill="#59D9F8"/>
  </g>

  <!-- Typography -->
  <text x="200" y="180" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#F5F7FF" text-anchor="middle" letter-spacing="4">LUNOVA OS</text>
  <text x="200" y="210" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="400" fill="#A7B2C9" text-anchor="middle" letter-spacing="3">AURORA • BEYOND THE DESKTOP</text>
</svg>
