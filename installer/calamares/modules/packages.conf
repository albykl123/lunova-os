# ==============================================================================
# Lunova OS 1.0.2 Aurora - Calamares Packages Module
# Strips live-session packages from the installed system so that
# update-initramfs generates a clean, standalone hard-disk boot image.
# ==============================================================================
---
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares'
      - 'calamares-settings-debian'
