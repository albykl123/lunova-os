# ==============================================================================
# Lunova OS 1.0.2 Aurora - Calamares Partitioning Module
# ==============================================================================
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"
  - "xfs"

# Do not silently pre-select destructive operations (mandatory safety requirement)
initialPartitioningChoice: none

# Allow swapfile or dedicated swap partition based on user preference
userSwapChoices:
  - none
  - small
  - suspend
  - file
defaultSwapChoice: file

# Support automated LUKS disk encryption if selected
enableLuksAutomatedPartitioning: true

# Render partition labels clearly and avoid nested confusion
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Default layout for fresh disk formatting
partitionLayout:
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
