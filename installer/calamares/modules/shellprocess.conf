# ==============================================================================
# Lunova OS 1.0.2 Aurora - Calamares Post-Install Cleanup (shellprocess)
# Purges live-session artifacts, restores standard security permissions,
# removes live autologin overrides, and executes final initramfs generation
# for the installed hard disk.
# ==============================================================================
---
dontChroot: false
timeout: 120

script:
  # 1. Remove live session installer desktop entries and autostart
  - "-rm -f /etc/skel/Desktop/install-lunova.desktop"
  - "-rm -f /home/*/{Desktop,desktop}/install-lunova.desktop"
  - "-rm -f /usr/share/applications/install-lunova.desktop"
  - "-rm -f /usr/local/bin/calamares"

  # 2. Purge live-session privilege escalation overrides
  - "-rm -f /etc/sudoers.d/99-calamares"
  - "-rm -f /etc/polkit-1/rules.d/49-calamares.rules"

  # 3. Clean live autologin override from SDDM config drop-ins
  - "-sed -i '/User=live/d' /etc/sddm.conf.d/kde_settings.conf"

  # 4. Ensure installed system defaults to graphical target with SDDM & NetworkManager
  - "-systemctl set-default graphical.target"
  - "-systemctl enable sddm.service"
  - "-systemctl enable NetworkManager.service"

  # 5. Rebuild initramfs with clean disk-only drivers (no live-boot interception)
  - "-update-initramfs -u -k all"
