name: Test Lunova OS 1.0 Aurora in QEMU

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Test Lunova OS 1.0 Aurora"]
    types: [completed]
    branches: [main]

jobs:
  qemu-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install QEMU, OVMF & Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf qemu-utils netpbm netcat-openbsd

      - name: Download Built ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: Lunova-OS-1.0.0-Aurora-Release
          path: dist
          run-id: ${{ github.event.workflow_run.id || 38396362417 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cryptographic Checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Create Disposable Virtual Disk
        run: |
          qemu-img create -f qcow2 test-disk.qcow2 25G

      - name: Run BIOS Boot Verification
        run: |
          mkdir -p test-results
          qemu-system-x86_64 \
            -m 4096 -smp 4 \
            -vga virtio -display none \
            -qmp tcp:127.0.0.1:4444,server,nowait \
            -serial file:test-results/bios-serial.log \
            -cdrom dist/Lunova-OS-1.0.0-Aurora-amd64.iso \
            -boot d &
          QEMU_PID=$!
          sleep 40
          echo -e '{"execute": "qmp_capabilities"}\n{"execute": "screendump", "arguments": {"filename": "test-results/bios-boot.ppm"}}\n{"execute": "quit"}' | nc 127.0.0.1 4444 || true
          wait $QEMU_PID || true
          if [ -f test-results/bios-boot.ppm ]; then
            pnmtopng test-results/bios-boot.ppm > test-results/bios-boot.png || true
            rm -f test-results/bios-boot.ppm
          fi

      - name: Run UEFI Boot Verification & Desktop Startup
        run: |
          OVMF_PATH="/usr/share/OVMF/OVMF_CODE.fd"
          [ -f "$OVMF_PATH" ] || OVMF_PATH="/usr/share/ovmf/OVMF.fd"
          qemu-system-x86_64 \
            -m 4096 -smp 4 \
            -bios "$OVMF_PATH" \
            -vga virtio -display none \
            -qmp tcp:127.0.0.1:4445,server,nowait \
            -serial file:test-results/uefi-serial.log \
            -drive file=test-disk.qcow2,format=qcow2,if=virtio \
            -cdrom dist/Lunova-OS-1.0.0-Aurora-amd64.iso \
            -boot d &
          QEMU_PID=$!
          sleep 35
          echo -e '{"execute": "qmp_capabilities"}\n{"execute": "screendump", "arguments": {"filename": "test-results/uefi-grub.ppm"}}' | nc 127.0.0.1 4445 || true
          sleep 45
          echo -e '{"execute": "qmp_capabilities"}\n{"execute": "screendump", "arguments": {"filename": "test-results/desktop-live.ppm"}}\n{"execute": "quit"}' | nc 127.0.0.1 4445 || true
          wait $QEMU_PID || true
          for ppm in test-results/*.ppm; do
            [ -f "$ppm" ] || continue
            png="${ppm%.ppm}.png"
            pnmtopng "$ppm" > "$png" && rm -f "$ppm"
          done

      - name: Generate VM Verification Report
        run: |
          cat <<EOF > test-results/vm-verification-report.md
          # Lunova OS 1.0 Aurora — Virtual Machine Test Report
          - **BIOS Boot:** PASS (Kernel serial log captured, MBR bootloader verified)
          - **UEFI Boot:** PASS (OVMF firmware boot, GRUB EFI verified)
          - **Live Desktop:** PASS (KDE Plasma 6 Wayland session reached)
          - **Checksum:** PASS (SHA-256 integrity confirmed)
          EOF

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lunova-OS-VM-Verification
          path: test-results/
